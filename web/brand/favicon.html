<!doctype html>
<!-- Source for favicon.png and apple-touch-icon.png. Render at 512x512, then resize. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Manufacturing Consent"; src: url("fonts/manufacturing-consent.woff") format("woff"); font-display: block; }
  html, body { margin: 0; width: 512px; height: 512px; background: #ffffff; color: #17181c; overflow: hidden; }
  /* The S is centered on its ink, not its text box, so left and top are measured values. */
  span { position: absolute; left: 112px; top: -17px; font: 486px/1 "Manufacturing Consent", serif; }
</style>
<span>S</span>
