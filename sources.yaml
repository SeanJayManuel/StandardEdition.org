# Standard Edition source list (v0.1)
#
# lean:  left | center | right | unrated   (unrated outlets count toward coverage, not breadth)
# type:  wire | national | regional | international | primary
#
# Lean labels are starting assumptions based on public media-bias ratings
# (e.g. AllSides, Ad Fontes). They are editable on purpose and are published
# on the "How we choose" page. Review quarterly.
#
# Feed URLs are unverified until `python -m boringnews.pipeline check-feeds`
# reports them healthy. Reuters and AP do not offer public RSS feeds.

sources:
  # ---- left ----
  - id: npr
    name: NPR
    url: https://feeds.npr.org/1001/rss.xml
    lean: left
    type: national
  - id: nyt-us
    name: The New York Times (U.S.)
    url: https://rss.nytimes.com/services/xml/rss/nyt/US.xml
    lean: left
    type: national
  - id: guardian-us
    name: The Guardian (U.S.)
    url: https://www.theguardian.com/us-news/rss
    lean: left
    type: national
  - id: cbs
    name: CBS News
    url: https://www.cbsnews.com/latest/rss/main
    lean: left
    type: national
  - id: washington-post
    name: The Washington Post (National)
    url: https://feeds.washingtonpost.com/rss/national
    lean: left
    type: national
    # AllSides (to confirm): Lean Left, https://www.allsides.com/news-source/washington-post-media-bias
  - id: politico
    name: Politico
    url: https://rss.politico.com/politics-news.xml
    lean: left
    type: national
    # AllSides (to confirm): Lean Left, https://www.allsides.com/news-source/politico-media-bias
  - id: axios
    name: Axios
    url: https://api.axios.com/feed/
    lean: left
    type: national
    # AllSides (to confirm): Lean Left (moved from Center in 2023), https://www.allsides.com/news-source/axios-media-bias
  - id: la-times
    name: Los Angeles Times (Nation)
    url: https://www.latimes.com/nation/rss2.0.xml
    lean: left
    type: regional
    # No AllSides page found yet. Hand-set lean, provisional.

  # ---- center ----
  - id: the-hill
    name: The Hill
    url: https://thehill.com/news/feed/
    lean: center
    type: national
  - id: bbc-world
    name: BBC News (World)
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    lean: center
    type: international
  - id: upi
    name: United Press International
    url: https://rss.upi.com/news/top_news.rss
    lean: center
    type: wire
    # AllSides (to confirm): Center, low confidence, https://www.allsides.com/news-source/united-press-international-media-bias
  - id: csmonitor
    name: The Christian Science Monitor
    url: https://rss.csmonitor.com/feeds/all
    lean: center
    type: national
    # AllSides (to confirm): Center, https://www.allsides.com/news-source/christian-science-monitor
  - id: newsnation
    name: NewsNation
    url: https://www.newsnationnow.com/feed/
    lean: center
    type: national
    # AllSides (to confirm): Center, https://www.allsides.com/news-source/newsnation-media-bias . Same owner as The Hill (Nexstar).
  - id: reason
    name: Reason
    url: https://reason.com/feed/
    lean: center
    type: national
    # AllSides (to confirm): Center (libertarian; moved from Lean Right in 2024), https://www.allsides.com/news-source/reason-media-bias
  - id: oregonian
    name: The Oregonian
    url: https://www.oregonlive.com/arc/outboundfeeds/rss/?outputType=xml
    lean: center
    type: regional
    # AllSides (to confirm): Center, low confidence, https://www.allsides.com/news-source/oregonian-media-bias

  # ---- right ----
  - id: fox-politics
    name: Fox News (Politics)
    url: https://moxie.foxnews.com/google-publisher/politics.xml
    lean: right
    type: national
  - id: ny-post
    name: New York Post
    url: https://nypost.com/feed/
    lean: right
    type: national
  - id: washington-times
    name: The Washington Times
    url: https://www.washingtontimes.com/rss/headlines/news/politics/
    lean: right
    type: national
  - id: washington-examiner
    name: Washington Examiner
    url: https://www.washingtonexaminer.com/feed/
    lean: right
    type: national
    # AllSides (to confirm): Lean Right, https://www.allsides.com/news-source/washington-examiner-media-bias
  - id: the-dispatch
    name: The Dispatch
    url: https://thedispatch.com/feed/
    lean: right
    type: national
    # AllSides (to confirm): Lean Right, https://www.allsides.com/news-source/dispatch-media-bias
  - id: national-review
    name: National Review
    url: https://www.nationalreview.com/feed/
    lean: right
    type: national
    # AllSides (to confirm): Lean Right (news), https://www.allsides.com/news-source/national-review-news-media-bias
  - id: center-square
    name: The Center Square
    url: https://www.thecentersquare.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc
    lean: right
    type: regional
    # AllSides (to confirm): Lean Right, low confidence, https://www.allsides.com/news-source/center-square-media-bias

  # ---- unrated / international ----
  - id: al-jazeera
    name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    lean: unrated
    type: international
  - id: dw
    name: DW (Deutsche Welle)
    url: https://rss.dw.com/rdf/rss-en-all
    lean: center
    type: international
    # AllSides (to confirm): Center, low confidence, https://www.allsides.com/news-source/deutsche-welle-media-bias
  - id: france24
    name: France 24
    url: https://www.france24.com/en/rss
    lean: unrated
    type: international
    # AllSides: Not Rated, https://www.allsides.com/news-source/france-24-media-bias

  # ---- official sources, straight from the government ----
  # role: record     legal or statistical standing (laws, rules, rulings, votes,
  #                   official statistics). Adds the 25% `record` part of the score.
  # role: statement  an institution describing its own work (press releases).
  #                   Listed, labeled "Official statement", never adds to the score.
  # Official sources never count toward a story's spectrum score. `max_items`
  # caps how many uncovered items each one adds per edition, newest first.

  - id: congress
    name: Congress.gov
    url: https://api.congress.gov/v3/bill
    fetcher: congress          # needs CONGRESS_API_KEY; keeps passed / signed / vetoed bills only
    lean: unrated
    type: primary
    role: record
    topic: government
    max_items: 6

  - id: white-house-actions
    name: White House (presidential actions)
    url: https://www.whitehouse.gov/presidential-actions/feed/
    lean: unrated
    type: primary
    role: statement
    topic: government
    max_items: 4

  - id: federal-register-rules
    name: Federal Register (significant rules)
    url: https://www.federalregister.gov/api/v1/documents.json
    fetcher: federal_register  # no key needed
    params:
      types: [RULE]
      significant: true
    lean: unrated
    type: primary
    role: record
    topic: government
    max_items: 5

  - id: federal-register-presidential
    name: Federal Register (presidential documents)
    url: https://www.federalregister.gov/api/v1/documents.json
    fetcher: federal_register  # executive orders and proclamations as legally published
    params:
      types: [PRESDOCU]
    lean: unrated
    type: primary
    role: record
    topic: government
    max_items: 4

  - id: war-department-releases
    name: Department of War (news releases)
    url: https://www.war.gov/news/rss_releases2.xml
    lean: unrated
    type: primary
    role: statement
    topic: government
    max_items: 4

  # More official feeds worth adding (all RSS, no key):
  #   https://www.govinfo.gov/rss/crec.xml        Congressional Record
  #   https://www.govinfo.gov/rss/bills-enr.xml   Enrolled bills (passed both chambers)
  #   https://www.govinfo.gov/rss/gaoreports.xml  GAO reports
  #   https://www.govinfo.gov/rss/uscourts-cadc.xml  D.C. Circuit opinions (one feed per court)
  # Full list: https://www.govinfo.gov/feeds
