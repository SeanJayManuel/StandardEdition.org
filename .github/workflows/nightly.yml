name: Nightly edition

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}

# Manual and scheduled runs must never publish over each other.
concurrency:
  group: standard-edition-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.lock
      - run: npm ci
      - run: npm run check
      - name: Rebuild the database from past editions
        run: python -m boringnews.archive restore
      - uses: actions/cache@v4
        with:
          path: data/models
          key: grouping-all-MiniLM-L6-v2
      - name: Build today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BN_BASE_URL: https://standardedition.org
        run: python -m boringnews.pipeline run --require-writer
      - name: Export the site
        env:
          BN_BASE_URL: https://standardedition.org
        run: python -m boringnews.export_static --out site
      - name: Stage the complete publication
        run: |
          mkdir -p publication/web
          cp -R site functions archive publication/
          cp web/core.js publication/web/
          cp package.json package-lock.json publication/
          printf '%s\n' "$GITHUB_SHA" > publication/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.run_id }}
          path: publication/
          if-no-files-found: error
          retention-days: 90

  # Saving the recovery data and publishing are independent. A busy source
  # branch cannot stop an already validated edition reaching readers.
  archive:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ github.run_id }}
          path: publication
      - name: Commit edition snapshots
        run: |
          mkdir -p archive
          cp -R publication/archive/. archive/
          git config user.name "standard-edition-bot"
          git config user.email "standard-edition-bot@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "Archive already contains this edition."
            exit 0
          fi
          git commit -m "Publish edition snapshots from run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Archive push failed; recover snapshots from the publication artifact." >&2
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ github.run_id }}
          path: publication
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: publication
      - name: Deploy the validated artifact
        working-directory: publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --no -- wrangler pages deploy site --project-name standard-edition --branch main
